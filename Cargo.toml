[package]
name = "crodot"
version = "0.1.0"
edition = "2024"

[dependencies]
log = { version = "0.4" }
colog = { version = "1.4" }
env_logger = { version = "0.11" } 
reqwest = { version = "0.13", features = ["blocking"] }
html-to-markdown-rs = { version = "2.3" }
llm = { version = "1.2.4", features = ["openai", "anthropic", "google", "mistral"] }
serde = { version = "1"}
serde_json = { version = "1" }
ratatui = {version = "0.30"}
crossterm = {version = "0.29"}
fuzzy-matcher = { version = "0.3" }
unicode-segmentation = { version = "1.13" }
tokio = { version = "1.52" }
thiserror = { version = "2.0" }

[dev-dependencies]
tempfile = { version = "3.2"}
